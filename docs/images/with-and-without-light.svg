<text x="66" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">Paste last time&#x27;s notes into the chat</text>
