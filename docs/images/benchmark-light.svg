<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
<title id="title">Benchmark: what-changed skill versus a plain agent</title>
<desc id="desc">Bar chart from docs/benchmark.md. Quality, higher is better, skill versus plain agent: changes caught 18 of 18 versus 17 of 18; current value right 16 of 18 versus 15 of 18; unchanged items left alone 9 of 9 versus 8 of 9; quotes found on the cited page 47 of 47 versus 24 of 26; preferred by both judges on 13 versus 3 of the 16 items that were not ties. Cost, lower is better: input tokens per item about 507 thousand versus 89 thousand, 5.7 times; minutes per topic 4.6 versus 1.0, 4.6 times.</desc>
