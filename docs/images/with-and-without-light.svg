<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-labelledby="title desc">
<title id="title">What changes with the what-changed skill</title>
<desc id="desc">Side-by-side comparison of the same task. Left, labelled as an illustration and not a real run: without the skill you paste your old notes into the chat each time, the agent searches and answers with links, you work out what is new yourself, and nothing is kept for next time. Right, from the real example run codex-run-2 (the claim and the report): a topic with three trusted sources checked weekly; precheck.py writes &#x27;No change&#x27; without a model when nothing changed; each claim, such as C-005 about where Codex looks for skills, is kept in a ledger with a verbatim quote, the source tier T1, the label read, a confidence level and the date first seen; the daily digest lists only what is new (C-001 to C-008) and what could not be checked (2 sources).</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470.0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328" text-anchor="middle">The same job: what changed since last time?</text>
<rect x="20" y="50" width="430" height="400" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="30" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Without the skill</text>
